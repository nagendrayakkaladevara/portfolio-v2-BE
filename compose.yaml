# Local PostgreSQL. Production uses Neon; no credentials are committed here.
services:
  postgres:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - portfolio_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  portfolio_data:
