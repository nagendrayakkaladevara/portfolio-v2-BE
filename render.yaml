# Docker deployment blueprint. Supply secrets in your host, never this file.
services:
  - type: web
    name: sai-nagendra-portfolio-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    preDeployCommand: npm run db:migrate:production
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: AUTH_OWNER_SUBJECTS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PRIVATE_BUCKET
        sync: false
      - key: R2_PUBLIC_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
